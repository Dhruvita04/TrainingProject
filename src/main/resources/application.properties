spring.application.name=billdesk
server.port=9999

spring.datasource.url=jdbc:mysql://localhost:3306/library?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

# 2. JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# 3. SQL Logging (Optional for Development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=ThisIsALearningSecretKeyPleaseChangeItLater123456789
app.jwt.expiration-ms=86400000
